      body: "Das Schlimmste war, Bilder von mir zu sehen und als Erstes die kahle Stelle zu bemerken. Ich habe mit HaarVita angefangen, nachdem ich Kollagen und teure Haaröle probiert hatte. Ich war immer noch auf Ozempic, aber ich hatte endlich das Gefühl, etwas Gezieltes gegen den Haarausfall zu tun. Die kahle Stelle war nach ein paar Wochen wieder bedeckt.",
      image: "https://cdn.shopify.com/s/files/1/1062/0770/7473/files/Bevor_23.png?v=1790345859"
    },
    {
      name: "Rahel N., 39",
      brand: "wegovy",
      brandLabel: "WEGOVY",
      title: "„Ich liebte meine Fortschritte, aber hasste den Waschtag“",
      body: "Wegovy hat mir geholfen Gewicht zu verlieren, das ich jahrelang mit mir herumgetragen habe, aber Haare waschen wurde emotional. Ich habe sogar angefangen Shampoo-Tage zu vermeiden. Mit HaarVita angefangen, weil ich nicht noch eine tägliche Sache wollte, an der ich scheitere. Nach ungefähr einem Monat war der Abfluss nicht mehr so voll.",
      image: "https://cdn.shopify.com/s/files/1/1062/0770/7473/files/Bevor_24.png?v=1790346067"
    }
  ];

  var brandNames = {
    all: "Alle GLP-1s",
    mounjaro: "Mounjaro",
    ozempic: "Ozempic",
    wegovy: "Wegovy",
    semaglutide: "Semaglutide",
    tirzepatide: "Tirzepatide"
  };

  function renderCard(r) {
    var stars = '';
    for (var i = 0; i < 5; i++) stars += starSVG;

    return '<div class="hvrw-card" data-brand="' + r.brand + '">' +
      '<div class="hvrw-card-img-wrap">' +
        '<img src="' + r.image + '" alt="' + r.name + ' Vorher Nachher" loading="lazy">' +
        '<span class="hvrw-badge-before">VORHER</span>' +
        '<span class="hvrw-badge-after">NACHHER</span>' +
      '</div>' +
      '<div class="hvrw-card-body">' +
        '<span class="hvrw-brand-tag">' + r.brandLabel + '</span>' +
        '<div class="hvrw-card-meta">' +
          '<span class="hvrw-card-name">' + r.name + '</span>' +
          '<span class="hvrw-verified">' + checkSVG + ' Verifiziert</span>' +
        '</div>' +
        '<div class="hvrw-stars">' + stars + '</div>' +
        '<div class="hvrw-card-title">' + r.title + '</div>' +
        '<div class="hvrw-card-text">' + r.body + '</div>' +
      '</div>' +
    '</div>';
  }

  function renderAll(filter) {
    var carousel = document.getElementById('hvrwCarousel');
    var html = '';
    for (var i = 0; i < reviews.length; i++) {
      if (filter === 'all' || reviews[i].brand === filter) {
        html += renderCard(reviews[i]);
      }
    }
    carousel.innerHTML = html;
    carousel.scrollLeft = 0;

    var sub = document.getElementById('hvrwFilterSub');
    sub.innerHTML = 'Zeigt verifizierte Bewertungen von Frauen auf <strong>' + brandNames[filter] + '</strong>.';
  }

  document.getElementById('hvrwFilter').addEventListener('change', function() {
    renderAll(this.value);
  });

  renderAll('all');
})();
</script>
